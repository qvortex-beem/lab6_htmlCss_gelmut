<!doctype html>
<html lang="ru-RU">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>формы</title>
      <link rel="stylesheet" href="style.css" />
   </head>
   <body>
      <header>
         <h1>HTML Формы</h1>
      </header>
      <main>
         <section>
            <form action="">
               <fieldset>
                  <legend>Регистрация</legend>
                  <label for=""> Имя <input type="text" placeholder="Ваше имя" required /> </label>
                  <label for=""> Email <input type="email" autocomplete="email" /> </label>
                  <label for=""> Пароль <input type="password" readonly value="12345" /> </label>
                  <label for=""> Комментарий <textarea placeholder="Текст"></textarea></label>
                  <label for="">
                     Поколение ЭВМ
                     <select>
                        <optgroup label="ЭВМ">
                           <option value="">Первое</option>
                           <option value="">Второе</option>
                        </optgroup>
                     </select>
                  </label>
                  <label for=""> Число <input type="number" inputmode="numeric" disabled /> </label>
                  <button type="submit">Отправить</button>
               </fieldset>
            </form>
         </section>
         <aside>
            <p>Пример обязательных и отключенных полей</p>
         </aside>
      </main>
      <footer>
         <a href="index.html">Назад</a>
      </footer>
   </body>
</html>
